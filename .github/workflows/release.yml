name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: "startsWith(github.event.head_commit.message, 'release: v')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag the release commit
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          subject=$(printf '%s\n' "$COMMIT_MESSAGE" | head -n 1)
          tag=${subject#"release: "}
          tag=${tag%%[[:space:]]*}
          tag=${tag%$'\r'}
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9][0-9A-Za-z._+-]*$'; then
            echo "commit subject must start with release: vX.Y.Z (got: ${tag})"
            exit 1
          fi
          git tag -f "$tag"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build binaries
        run: |
          mkdir -p dist
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              ext=""
              if [ "$os" = "windows" ]; then ext=".exe"; fi
              out="dist/sieve_${os}_${arch}${ext}"
              GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "$out" ./cmd/sieve
            done
          done
          cd dist && sha256sum sieve_* > checksums.txt
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*
          generate_release_notes: true
