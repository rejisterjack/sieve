<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="sv-bg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#12182b" />
      <stop offset="60%" stop-color="#090d18" />
      <stop offset="100%" stop-color="#04060c" />
    </radialGradient>
    <linearGradient id="sv-stroke" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(99, 102, 241, 0.55)" />
      <stop offset="50%" stop-color="rgba(56, 189, 248, 0.25)" />
      <stop offset="100%" stop-color="rgba(99, 102, 241, 0.10)" />
    </linearGradient>
    <linearGradient id="sv-filter" x1="120" y1="120" x2="390" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="sv-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#sv-bg)" stroke="url(#sv-stroke)" stroke-width="6" />
  <circle cx="256" cy="256" r="130" fill="#6366f1" opacity="0.12" filter="url(#sv-glow)" />

  <g transform="translate(0, -4)">
    <!-- Concentric Sieve Filtration Lattice Rings -->
    <polygon points="256,96 384,170 384,318 256,392 128,318 128,170" fill="none" stroke="url(#sv-filter)" stroke-width="8" stroke-linejoin="round" opacity="0.45" />
    <polygon points="256,136 348,189 348,295 256,348 164,295 164,189" fill="none" stroke="url(#sv-filter)" stroke-width="12" stroke-linejoin="round" />

    <!-- Filtration Lattice Crossbars (Deflecting Malicious Injections) -->
    <line x1="164" y1="216" x2="348" y2="216" stroke="url(#sv-filter)" stroke-width="6" stroke-linecap="round" />
    <line x1="164" y1="268" x2="348" y2="268" stroke="url(#sv-filter)" stroke-width="6" stroke-linecap="round" />
    <line x1="256" y1="136" x2="256" y2="348" stroke="url(#sv-filter)" stroke-width="6" stroke-linecap="round" stroke-dasharray="12,12" />

    <!-- Verified Clean Token Core -->
    <circle cx="256" cy="242" r="28" fill="#04060c" stroke="#38bdf8" stroke-width="8" />
    <circle cx="256" cy="242" r="10" fill="#34d399" filter="url(#sv-glow)" />
  </g>
</svg>

